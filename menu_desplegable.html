<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>menuuu</title>

    <style>
      header {
        background-color: rgb(63, 63, 63);
        color: lightgray;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;    
        font-size: larger;
        
    }

    nav {
        background-color: rgb(63, 63, 63);
    }

    #menu {
        background-color: rgb(98, 0, 255);
        list-style: none;
        overflow: auto;
    }


    #menu > li {
        float: left;
        width: 150px;

    }

    #menu li ul {
        display: none;
    }

    #menu > li ul {
        float: none;
    }

    #menu li:hover ul {
        display: block;
        position: absolute;
        
    }

    #menu > li > a {
        color: white;
        text-decoration: none;
        font-family: Arial, Helvetica, sans-serif;
        font-size: larger;
    }



    section {
        min-height: 600px;
        background-color: rgb(255, 255, 255);
    }
    
    footer {
        background-color: rgb(63, 63, 63);
        color: lightgray;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;    
        font-size: small;
    }




    </style>
</head>
<body>
    <header>
      Ejemplo de menu desplegable
    </header>

    <nav>
        <ul id="menu">
          <li><a href="#">opcion1</a></li>
          <li><a href="#">opcion2</a>

            <ul>
                <li>submenu 1</li>
                <li>submenu 2</li>
            </ul>
          </li>

          <li><a href="#">opcion3</a></li>
        </ul>
    </nav>

    <section>

    </section>

    <footer>
        (c) Virgen de Gracia
    </footer>


    
</body>
</html>
